<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TESSERA Tokyo | Reservations</title>
  <meta
    name="description"
    content="Reservations for TESSERA Tokyo, located in Kamimeguro, Tokyo."
  >

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=STIX+Two+Math&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">

  <!-- OGP -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TESSERA">
  <meta property="og:title" content="TESSERA Tokyo | Reservations">
  <meta
    property="og:description"
    content="Reservations for TESSERA Tokyo, located in Kamimeguro, Tokyo."
  >
  <meta property="og:url" content="https://tessera.tokyo/">
  <meta property="og:image" content="https://tessera.tokyo/ogp.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- X / Twitter -->
  <meta name="twitter:card" content="summary_large_image">
</head>

<body>
  <main class="page">

    <!-- Logo -->
    <header class="site-header">
      <img
        class="logo"
        src="logo.svg"
        alt="TESSERA"
      >
    </header>

    <!-- Reservations -->
    <section class="content" aria-labelledby="reservations-title">

      <div class="reservations">
        <h1 id="reservations-title">RESERVATIONS</h1>

        <nav class="reservation-links" aria-label="Reservation language">
          <a
            href="https://www.tablecheck.com/ja/tessera-tokyo"
            target="_blank"
            rel="noopener noreferrer"
            lang="ja"
          >JP</a>

          <span class="separator" aria-hidden="true">/</span>

          <a
            href="https://www.tablecheck.com/en/tessera-tokyo"
            target="_blank"
            rel="noopener noreferrer"
            lang="en"
          >EN</a>
        </nav>
      </div>

      <!-- Address & Contact -->
      <div class="information">

        <a
          class="address"
          href="https://maps.app.goo.gl/Dw8anc94WWdaA7UeA"
          target="_blank"
          rel="noopener noreferrer"
        >
          5-16-11 Kamimeguro, Meguro-ku, Tokyo 153-0051
        </a>

        <p class="contact">
          For larger parties, please contact us at<br>
          <a href="mailto:info@tessera.tokyo">info@tessera.tokyo</a>
        </p>

      </div>

    </section>

  </main>

</html>
